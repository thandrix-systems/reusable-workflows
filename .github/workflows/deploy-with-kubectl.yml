name: deploy-with-kubectl

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: 'Deployment Environment (e.g Integration, Master)'
        required: true 
        type: string
      NAMESPACE:
        description: 'Kubernetes Namespace'
        required: true
        type: string
      IMAGE_NAME:
        description: 'Docker Image Name'
        required: true
        type: string

    secrets:
      KUBECONFIG:
        description: 'Kubeconfig for the target cluster'
        required: true
      DOCKERHUB_USERNAME:
        description: 'Docker Hub username with pull access'
        required: true
      DOCKERHUB_PASSWORD:
        description: 'Docker Hub password or token with pull access'
        required: true

permissions:
  actions: read
  security-events: write  
  packages: write
  contents: read 

jobs:
  deploy:
    environment: ${{ inputs.ENVIRONMENT }}
    env:
      NAMESPACE: ${{ inputs.NAMESPACE}}  
    runs-on: arc-runner-set
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ -z "$SERVER" ]; then
            echo "::error::KUBECONFIG is invalid: cluster server URL is missing"
            exit 1
          fi
          if echo "$SERVER" | grep -q "kubernetes.docker.internal"; then
            echo "::error::KUBECONFIG points to Docker Desktop (kubernetes.docker.internal), which is not reachable from GitHub-hosted runners"
            echo "::error::Update KUBECONFIG secret to a reachable cluster endpoint"
            exit 1
          fi
          kubectl config current-context
          kubectl config view --minify

      - name: Validate required deploy inputs
        run: |
          if [ -z "${NAMESPACE}" ]; then
            echo "::error::NAMESPACE input is empty. Set vars.NAMESPACE in the caller repo/environment."
            exit 1
          fi

      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/download/v4.30.6/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          
      - name: Update Deployment Image
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          IMAGE="${{ inputs.IMAGE_NAME }}:${IMAGE_TAGS}"

          yq e ".spec.template.spec.containers[0].image = \"${IMAGE}\"" -i manifests/deployment.yaml
          cat manifests/deployment.yaml
      - name: Create Namespace if not exists
        run: |
          kubectl get namespace "$NAMESPACE" || kubectl create namespace "$NAMESPACE"

      - name: Create Docker Hub image pull secret
        run: |
          kubectl create secret docker-registry dockerhub-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server=index.docker.io \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
         
      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl apply -f manifests/ -n $NAMESPACE
      - name: Wait for Deployment Rollout
        run: |    
          kubectl rollout status deployment/thandrix-app -n $NAMESPACE
          kubectl get all -n $NAMESPACE  
